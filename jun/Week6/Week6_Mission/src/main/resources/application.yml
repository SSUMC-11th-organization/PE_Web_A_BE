spring:
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # 기본값(true)이면 "score": 3.5 가 3으로 잘려 통과한다. 소수는 400으로 거절한다.
      accept-float-as-int: false
