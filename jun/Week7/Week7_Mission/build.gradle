plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.umc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
	// JWT 생성/검증 라이브러리
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()

	// Windows에서 임시 폴더 경로에 한글이 있으면 Mockito가 에이전트 jar를 붙이지 못해 모든 mock 생성이 실패한다.
	// (InstrumentationImpl.appendToBootstrapClassLoaderSearch → IllegalArgumentException)
	// 그런 환경에서만 테스트 JVM의 임시 폴더를 ASCII 경로로 바꾼다.
	def tmpDir = System.getProperty('java.io.tmpdir')
	if (!tmpDir.matches('\\p{ASCII}*')) {
		def asciiTmp = file("${System.getenv('SystemDrive') ?: 'C:'}/Temp/gradle-test-tmp")
		doFirst { asciiTmp.mkdirs() }
		systemProperty 'java.io.tmpdir', asciiTmp.absolutePath
	}
}
