spring:
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      # 기본값(true)이면 "score": 3.5 가 3으로 잘려 통과한다. 소수는 400으로 거절한다.
      accept-float-as-int: false

jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키(32자 이상). 코드에 직접 쓰지 않습니다
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)
