<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영화 평점 서비스</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    section { border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; }
    pre { background: #f5f5f5; padding: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🎬 영화 평점 서비스</h1>

  <section>
    <h3>닉네임 중복 체크</h3>
    <input id="nickname" placeholder="닉네임 (예: 수현)" />
    <button onclick="checkNickname()">확인</button>
    <pre id="nicknameResult"></pre>
  </section>

  <section>
    <h3>이메일 중복 체크</h3>
    <input id="email" placeholder="이메일 (예: noco@umc.com)" />
    <button onclick="checkEmail()">확인</button>
    <pre id="emailResult"></pre>
  </section>

  <section>
    <h3>유저별 평점 조회</h3>
    <input id="memberId" type="number" placeholder="회원 ID (예: 1)" />
    <button onclick="getRatings()">조회</button>
    <pre id="ratingsResult"></pre>
  </section>

  <script>
    const BASE_URL = "http://localhost:8080";

    // 서버를 호출하고 결과를 화면에 보여주는 공통 함수
    async function callApi(path, resultId) {
      const result = document.getElementById(resultId);
      try {
        const res = await fetch(BASE_URL + path);
        const data = await res.json();
        result.textContent = `[HTTP ${res.status}]\n` + JSON.stringify(data, null, 2);
      } catch (e) {
        result.textContent = "요청 실패: " + e.message + "\n(서버가 켜져 있는지, F12 Console에 CORS 에러가 없는지 확인하세요)";
      }
    }

    function checkNickname() {
      const nickname = document.getElementById("nickname").value;
      callApi(`/members/nickname/${encodeURIComponent(nickname)}`, "nicknameResult");
    }

    function checkEmail() {
      const email = document.getElementById("email").value;
      callApi(`/members/email/${encodeURIComponent(email)}`, "emailResult");
    }

    function getRatings() {
      const memberId = document.getElementById("memberId").value;
      callApi(`/members/${memberId}/ratings`, "ratingsResult");
    }
  </script>
</body>
</html>
